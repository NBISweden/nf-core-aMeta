lint:
  files_exist:
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/CONTRIBUTING.md
    - .github/.dockstore.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-ameta_logo_light.png
    - docs/images/nf-core-ameta_logo_light.png
    - docs/images/nf-core-ameta_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  files_unchanged:
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - .github/CONTRIBUTING.md
    - .github/.dockstore.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-ameta_logo_light.png
    - docs/images/nf-core-ameta_logo_light.png
    - docs/images/nf-core-ameta_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
  readme:
    - nextflow_badge
nf_core_version: 4.0.3
repository_type: pipeline
template:
  author: Mahesh Binzer-Panchal
  description: An nf-core compliant version of aMeta; An ancient metagenomic profiling
    Snakemake workflow
  force: false
  is_nfcore: false
  name: aMeta
  org: NBISweden
  outdir: .
  skip_features:
    - github
    - igenomes
    - gpu
  version: 1.0.0dev
