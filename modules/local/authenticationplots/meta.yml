name: authenticationplots
description: |
  Generates per-taxon ancient DNA authentication plots using the authentic.R
  script from HOPS. Combines read length distribution, PMD scores, breadth of
  coverage, and MaltExtract results into a multi-panel PDF report. Also converts
  the PDF to PNG for quick viewing.
keywords:
  - hops
  - authentic.R
  - ancient DNA
  - authentication
  - visualisation
tools:
  - hops:
      description: HOPS (Heuristic Operations for Pathogen Screening) toolkit
      homepage: https://github.com/rhuebler/HOPS
      documentation: https://github.com/rhuebler/HOPS
      licence: ["GPL-3.0-or-later"]
      identifier: ""
  - imagemagick:
      description: Suite of tools to create, edit, compose or convert images
      homepage: https://imagemagick.org/
      documentation: https://imagemagick.org/script/command-line-processing.php
      licence: ["ImageMagick"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample and taxon information,
          e.g. [ id:'sample1', taxid:'1234' ]
    - node_list:
        type: file
        description: node_list.txt from MAKENODELIST
        pattern: "node_list.txt"
        ontologies: []
    - read_length:
        type: file
        description: Read length distribution file from READLENGTHDISTRIBUTION
        pattern: "*.read_length.txt"
        ontologies: []
    - pmd_scores:
        type: file
        description: PMD scores file from PMDTOOLS_SCORE
        pattern: "*.PMDscores.txt"
        ontologies: []
    - breadth_of_coverage:
        type: file
        description: Breadth of coverage file from BREADTHOFCOVERAGE
        pattern: "*.breadth_of_coverage"
        ontologies: []
    - name_list:
        type: file
        description: Name list file from BREADTHOFCOVERAGE
        pattern: "name_list.txt"
        ontologies: []
    - maltextract_results:
        type: directory
        description: MaltExtract results directory
        pattern: "*/"
        ontologies: []
output:
  pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample and taxon information
      - "*.pdf":
          type: file
          description: Multi-panel authentication plot PDF
          pattern: "*.pdf"
          ontologies: []
  png:
    - - meta:
          type: map
          description: Groovy Map containing sample and taxon information
      - "*.png":
          type: file
          description: PNG conversion of the authentication plot PDF
          pattern: "*.png"
          ontologies: []
authors:
  - "@mahesh-panchal"
maintainers:
  - "@mahesh-panchal"
