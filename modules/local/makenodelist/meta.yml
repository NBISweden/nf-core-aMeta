name: makenodelist
description: |
  Extracts the species name for each of a sample's candidate taxonomic
  identifiers from the KrakenUniq taxDB file using gawk, in a single pass per
  sample. The output node_list.txt files are required by MaltExtract and
  the authentication plotting scripts to identify the target organisms.
keywords:
  - taxonomy
  - taxid
  - node list
  - krakenuniq
  - ancient DNA
  - metagenomics
tools:
  - gawk:
      description: GNU implementation of the awk programming language
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information, e.g. [ id:'sample1' ]
  - taxids:
      type: list
      description: List of candidate taxonomic identifiers for the sample
  - taxdb_dir:
      type: directory
      description: KrakenUniq database directory containing the taxDB file
      pattern: "*/"
      ontologies: []
output:
  node_lists:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.node_list.txt":
          type: file
          description: |
            One file per requested taxon ID, named "<taxid>.node_list.txt",
            containing the species name(s) for that taxon ID, one per line.
            Used as input to MaltExtract and authentication scripts.
          pattern: "*.node_list.txt"
          ontologies: []
authors:
  - "@mahesh-panchal"
maintainers:
  - "@mahesh-panchal"
