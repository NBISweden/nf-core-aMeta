[workspace]
authors = ["Mahesh Binzer-Panchal <mahesh.binzer-panchal@nbis.se>"]
channels = ["conda-forge", "bioconda"]
name = "nf-core-aMeta"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
# Development
clean-all = "git clean -e .pixi -fdx"
clean-work = "nextflow clean -f -before last && find work -type d -empty -delete"
test = "nextflow run main.nf -resume -profile test,docker --outdir results --db_cache 'work/database_cache'"
# Nextflow
[tasks.lint]
cmd = """
nextflow lint \
    -exclude '.pixi' \
    -exclude 'nf-test.config' \
    -exclude 'modules/nf-core' \
    -exclude 'subworkflows/nf-core' \
    .
"""
# nf-core
[tasks.nf-core-sync]
cmd = "nf-core pipelines sync"
[tasks.update-modules]
cmd = "nf-core modules update"
[tasks.patch-module]
args = ["module"]
cmd = "nf-core modules patch {{ module }}"

[dependencies]
nextflow = ">=26.4.1,<27"
nf-core = ">=4.0.2,<5"
nf-test = ">=0.9.5,<0.10"
prek = ">=0.4.0,<0.5"
